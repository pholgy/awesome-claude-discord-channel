name: issue-link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const body = pr.body || ''
            const text = `${pr.title || ''}\n${body}`
            const linkedIssue = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+(?:#\d+|https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/\d+)/i

            if (!linkedIssue.test(text)) {
              core.setFailed('PRs must link an existing issue with Closes #123, Fixes #123, Resolves #123, or Refs #123.')
            }
